name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Die Tests starten Postgres selbst über Testcontainers (Docker ist auf dem Runner vorhanden)
      - name: Build und Tests
        run: ./mvnw -B verify

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen
        run: docker build -t sausage-api:ci .
      - name: Produktions-Compose prüfen
        working-directory: deploy
        run: DOMAIN=example.org REDIRECT_DOMAINS=www.example.org DB_PASSWORD=x JWT_SECRET=x docker compose -f docker-compose.prod.yml config --quiet
      - name: Caddyfile prüfen
        working-directory: deploy
        run: >
          docker run --rm -e DOMAIN=example.org -e REDIRECT_DOMAINS=www.example.org
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  # Nur auf main: Image nach ghcr.io und auf den Server (Secrets im Environment "production", siehe README)
  publish:
    name: Image veröffentlichen
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/regenolf/sausage-api
          # main = neuester Stand, sha-1a2b3c4 für Rollbacks (API_TAG in der .env auf dem Server)
          tags: |
            type=raw,value=main
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Auf den Server
    runs-on: ubuntu-latest
    needs: publish
    # Erst aktiv, wenn Server und Secrets eingerichtet sind: Repository-Variable DEPLOY_ENABLED=true
    if: vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://www.wurst-weiser.de
    # Nie zwei Deployments gleichzeitig; ein laufendes wird nicht abgebrochen
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sausage' }}
      PUBLIC_URL: https://www.wurst-weiser.de
    steps:
      - uses: actions/checkout@v7
      - name: SSH-Zugang einrichten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Compose-Datei und Caddyfile übertragen
        run: scp deploy/docker-compose.prod.yml deploy/Caddyfile "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
      - name: API aktualisieren
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # Das Token gilt nur für diesen Lauf; auf dem Server bleibt kein Registry-Zugang gespeichert.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && set -e; trap 'docker logout ghcr.io' EXIT
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 180 api
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            docker image prune -f"
      - name: Erreichbarkeit prüfen
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$PUBLIC_URL/api/categories" > /dev/null
