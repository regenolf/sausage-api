name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Die Tests starten Postgres selbst über Testcontainers (Docker ist auf dem Runner vorhanden)
      - name: Build und Tests
        run: ./mvnw -B verify

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen
        run: docker build -t sausage-api:ci .

  # Nur auf main: Image nach ghcr.io
  publish:
    name: Image veröffentlichen
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/regenolf/sausage-api
          # main = neuester Stand, sha-1a2b3c4 = feste Version (wird in kvm-infra eingetragen)
          tags: |
            type=raw,value=main
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Nur auf main: neuen sha-Tag in regenolf/kvm-infra eintragen – Argo CD rollt ihn im Cluster aus.
  # Benötigt das Secret KVM_INFRA_DEPLOY_KEY (Deploy Key mit Schreibrecht auf kvm-infra) und DEPLOY_ENABLED=true.
  deploy:
    name: Version ausrollen (GitOps)
    runs-on: ubuntu-latest
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://www.wurst-weiser.de
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions: {}
    env:
      IMAGE: ghcr.io/regenolf/sausage-api
      MANIFEST: cluster/sausage/kustomization.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          repository: regenolf/kvm-infra
          ssh-key: ${{ secrets.KVM_INFRA_DEPLOY_KEY }}
          path: kvm-infra
          fetch-depth: 0
      - name: Tag in kvm-infra setzen
        working-directory: kvm-infra
        # sausage-api und sausage-app schreiben in dieselbe Datei – bei gleichzeitigem Push neu aufsetzen
        run: |
          tag="sha-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase origin main
            sed -i "\#name: $IMAGE\$#{n;s#newTag: .*#newTag: $tag#}" "$MANIFEST"
            grep -A1 "name: $IMAGE\$" "$MANIFEST" | grep -q "newTag: $tag\$" \
              || { echo "::error::$IMAGE nicht in $MANIFEST gefunden"; exit 1; }
            if git diff --quiet; then echo "$tag ist bereits eingetragen"; exit 0; fi
            git commit -qam "sausage-api: $tag" -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            if git push -q origin HEAD:main; then
              echo "### sausage-api → \`$tag\` – Argo CD rollt in ca. 1 Minute aus" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git reset -q --hard origin/main
            sleep $((attempt * 5))
          done
          echo "::error::Push nach kvm-infra fehlgeschlagen"; exit 1
