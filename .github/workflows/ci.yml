name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Die Tests starten Postgres selbst über Testcontainers (Docker ist auf dem Runner vorhanden)
      - name: Build und Tests
        run: ./mvnw -B verify

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t sausage-api:ci .
      - name: Produktions-Compose prüfen
        working-directory: deploy
        run: DOMAIN=example.org DB_PASSWORD=x JWT_SECRET=x docker compose -f docker-compose.prod.yml config --quiet
