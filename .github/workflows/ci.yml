name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Die Tests starten Postgres selbst über Testcontainers (Docker ist auf dem Runner vorhanden)
      - name: Build und Tests
        run: ./mvnw -B verify
