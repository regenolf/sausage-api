spring.application.name=sausage-api

spring.datasource.url=jdbc:postgresql://localhost:5432/sausage
spring.datasource.username=sausage
spring.datasource.password=sausage

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# Kommagetrennte Liste der Frontend-Origins, die die API aus dem Browser aufrufen dürfen
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
