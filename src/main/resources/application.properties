spring.application.name=sausage-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sausage}
spring.datasource.username=${DB_USERNAME:sausage}
spring.datasource.password=${DB_PASSWORD:sausage}

# Es werden keine JPA-Entities verwendet (JdbcClient), daher keine offene Session im Web-Request
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# Kommagetrennte Liste der Frontend-Origins, die die API aus dem Browser aufrufen dürfen
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoint.health.probes.enabled=true
