spring.application.name=sausage-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sausage}
spring.datasource.username=${DB_USERNAME:sausage}
spring.datasource.password=${DB_PASSWORD:sausage}

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# Kommagetrennte Liste der Frontend-Origins, die die API aus dem Browser aufrufen dürfen
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:4200,capacitor://localhost,https://localhost,http://localhost:3000,http://localhost:5173}

management.endpoint.health.probes.enabled=true

# Anmeldung über Keycloak (OpenID Connect): Tokens müssen von diesem Realm stammen ("iss") und für diese API
# ausgestellt sein ("aud"). Lokal: docker compose startet Keycloak auf Port 8180 mit dem Realm "sausage".
app.oidc.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/sausage}
# Signaturschlüssel des Realms; leer = <issuer-uri>/protocol/openid-connect/certs (im Cluster intern, siehe kvm-infra)
app.oidc.jwk-set-uri=${OIDC_JWK_SET_URI:}
app.oidc.audience=${OIDC_AUDIENCE:sausage-api}
# Admin-API von Keycloak (Konto löschen, überall abmelden) mit dem Dienstkonto sausage-api-admin.
# Ohne Secret ändert die API nur ihre eigene Datenbank (Keycloak-Konto bleibt bestehen).
app.keycloak.admin-url=${KEYCLOAK_ADMIN_URL:http://localhost:8180}
app.keycloak.realm=${KEYCLOAK_REALM:sausage}
app.keycloak.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:sausage-api-admin}
app.keycloak.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Foto-Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Hinter einem Reverse-Proxy (z. B. nginx der sausage-app) die echte Client-IP aus X-Forwarded-For
# übernehmen. Tomcat vertraut dem Header nur von Proxys aus privaten Netzen (10.x, 172.16-31.x,
# 192.168.x, 127.x), direkt aus dem Internet lässt er sich also nicht fälschen.
server.forward-headers-strategy=native

# API-Dokumentation (Swagger UI, /v3/api-docs); in Produktion mit API_DOCS_ENABLED=false abschalten
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# Öffentliche Basis-URL (z. B. https://wurst.example.de) für absolute Foto-URLs; leer = aus der Anfrage ableiten
app.public-url=${PUBLIC_URL:}
# Foto-Kontingent pro Nutzer in 24 Stunden (Standard 50 MB; Admins ausgenommen)
app.photos.daily-quota-bytes=${PHOTO_DAILY_QUOTA_BYTES:52428800}
# Absender für E-Mails. SMTP über SPRING_MAIL_HOST/_PORT/_USERNAME/_PASSWORD; ohne SPRING_MAIL_HOST werden
# Mails nur ins Log geschrieben (Entwicklung)
app.mail.from=${MAIL_FROM:Sausage <noreply@sausage.invalid>}
# Versand über Port 587 mit STARTTLS (Pflicht) und Anmeldung; Timeouts, damit ein hängender Mailserver keine Requests blockiert
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Aktuelle Version der Nutzungsbedingungen; bei Änderungen erhöhen (Clients sehen dann currentTermsVersion != termsVersion)
app.terms.version=${TERMS_VERSION:2026-10-05}
