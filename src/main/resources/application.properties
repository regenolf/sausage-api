spring.application.name=sausage-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sausage}
spring.datasource.username=${DB_USERNAME:sausage}
spring.datasource.password=${DB_PASSWORD:sausage}

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# Kommagetrennte Liste der Frontend-Origins, die die API aus dem Browser aufrufen dürfen
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:4200,capacitor://localhost,https://localhost,http://localhost:3000,http://localhost:5173}

management.endpoint.health.probes.enabled=true

# Schlüssel zum Signieren der JWTs (mind. 32 Zeichen). In Produktion unbedingt per JWT_SECRET setzen!
app.jwt.secret=${JWT_SECRET:lokaler-entwicklungs-schluessel-bitte-nicht-produktiv-nutzen}
app.jwt.validity=${JWT_VALIDITY:PT1H}

# Foto-Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
